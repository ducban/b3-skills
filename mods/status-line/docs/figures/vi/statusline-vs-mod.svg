<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 874 416' width='874' height='416' font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif"><style>svg{--bg:#FFFFFF;--tx:#1A1A1A;--mu:#555555;--fa:#777777;--rule:#CCCCCC;--grid:#EEEEEE;--ar:#666666;--hl:#1A1A1A;--ink-f:#1A1A1A;--ink-s:#1A1A1A;--ink-t:#FFFFFF;--ink-u:#D0D0D0;--mid-f:#D9D9D9;--mid-s:#1A1A1A;--mid-t:#1A1A1A;--mid-u:#555555;--pale-f:#F2F2F2;--pale-s:#1A1A1A;--pale-t:#1A1A1A;--pale-u:#555555;--open-f:#FFFFFF;--open-s:#1A1A1A;--open-t:#1A1A1A;--open-u:#555555;--hatch-f:#FFFFFF;--hatch-s:#1A1A1A;--hatch-t:#1A1A1A;--hatch-u:#555555}@media (prefers-color-scheme:dark){svg{--bg:#17181A;--tx:#E8EAED;--mu:#A8ACB1;--fa:#8A8F94;--rule:#4A4D51;--grid:#26282B;--ar:#8A8F94;--hl:#C8CBCF;--ink-f:#E8EAED;--ink-s:#E8EAED;--ink-t:#17181A;--ink-u:#3A3D41;--mid-f:#4A4D51;--mid-s:#C8CBCF;--mid-t:#F0F1F3;--mid-u:#C3C7CB;--pale-f:#2A2C2F;--pale-s:#C8CBCF;--pale-t:#F0F1F3;--pale-u:#B0B4B8;--open-f:#17181A;--open-s:#C8CBCF;--open-t:#F0F1F3;--open-u:#A8ACB1;--hatch-f:#17181A;--hatch-s:#C8CBCF;--hatch-t:#F0F1F3;--hatch-u:#A8ACB1}}.bg{fill:var(--bg)}.tx{fill:var(--tx)}.mu{fill:var(--mu)}.fa{fill:var(--fa)}</style><defs><marker id='ah' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='var(--ar)'/></marker><pattern id='hx' patternUnits='userSpaceOnUse' width='7' height='7' patternTransform='rotate(45)'><rect width='7' height='7' fill='var(--bg)'/><line x1='0' y1='0' x2='0' y2='7' stroke='var(--hl)' stroke-width='1.5'/></pattern></defs><rect x='0' y='0' width='874' height='416' class='bg'/><text x='437' y='38' text-anchor='middle' font-size='18' font-weight='700' class='tx'>Lệnh statusLine so với mod, mỗi lần vẽ lại màn hình</text><rect x='30' y='62' width='380' height='50' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='220' y='92' text-anchor='middle' font-size='15' font-weight='700' fill='var(--pale-t)'>LỆNH STATUSLINE</text><rect x='464' y='62' width='380' height='50' rx='8' fill='var(--ink-f)' stroke='var(--ink-s)' stroke-width='1.4'/><text x='654' y='92' text-anchor='middle' font-size='15' font-weight='700' fill='var(--ink-t)'>STATUS-LINE</text><rect x='30' y='128' width='380' height='53.5' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='220' y='151.5' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--pale-t)'>Engine chạy một lệnh ngoài</text><text x='220' y='170' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>mỗi khi vẽ lại màn hình</text><rect x='464' y='128' width='380' height='53.5' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='654' y='151.5' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--pale-t)'>Engine nạp module một lần duy nhất</text><text x='654' y='170' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>vẽ lại chỉ là gọi một hàm</text><line x1='414' y1='154.8' x2='460' y2='154.8' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><rect x='30' y='191.5' width='380' height='53.5' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='220' y='215' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--pale-t)'>Mỗi lần vẽ mất khoảng 57 ms</text><text x='220' y='233.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>gần hết là Node khởi động</text><rect x='464' y='191.5' width='380' height='53.5' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='654' y='215' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--pale-t)'>Lúc vẽ chỉ đọc bộ nhớ</text><text x='654' y='233.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>số đã ghi sẵn khi sự kiện tới</text><line x1='414' y1='218.3' x2='460' y2='218.3' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><rect x='30' y='255' width='380' height='53.5' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='220' y='278.5' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--pale-t)'>Lệnh đọc 127 MB bản ghi hội thoại</text><text x='220' y='297' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>để cộng token, lần nào cũng đọc lại</text><rect x='464' y='255' width='380' height='53.5' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='654' y='278.5' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--pale-t)'>Việc đọc nặng chạy theo bộ hẹn giờ</text><text x='654' y='297' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>mỗi máy gọi hạn mức một lần, ba phút một</text><line x1='414' y1='281.8' x2='460' y2='281.8' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><rect x='30' y='318.5' width='380' height='53.5' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='220' y='342' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--pale-t)'>Lệnh vẽ dưới ô gõ</text><text x='220' y='360.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>và nằm yên chỗ đó</text><rect x='464' y='318.5' width='380' height='53.5' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='654' y='342' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--pale-t)'>Mod vẽ vào dải trên ô gõ</text><text x='654' y='360.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>dải đi theo ô gõ</text><line x1='414' y1='345.3' x2='460' y2='345.3' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><text x='437' y='402' text-anchor='middle' font-size='12.5' font-weight='400' class='mu' font-style='italic'>Số đo trên máy này. Cái phải chịu là dải đi theo ô gõ.</text></svg>