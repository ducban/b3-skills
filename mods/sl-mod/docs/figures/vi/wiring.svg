<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 705' width='980' height='705' font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif"><style>svg{--bg:#FFFFFF;--tx:#1A1A1A;--mu:#555555;--fa:#777777;--rule:#CCCCCC;--grid:#EEEEEE;--ar:#666666;--hl:#1A1A1A;--ink-f:#1A1A1A;--ink-s:#1A1A1A;--ink-t:#FFFFFF;--ink-u:#D0D0D0;--mid-f:#D9D9D9;--mid-s:#1A1A1A;--mid-t:#1A1A1A;--mid-u:#555555;--pale-f:#F2F2F2;--pale-s:#1A1A1A;--pale-t:#1A1A1A;--pale-u:#555555;--open-f:#FFFFFF;--open-s:#1A1A1A;--open-t:#1A1A1A;--open-u:#555555;--hatch-f:#FFFFFF;--hatch-s:#1A1A1A;--hatch-t:#1A1A1A;--hatch-u:#555555}@media (prefers-color-scheme:dark){svg{--bg:#17181A;--tx:#E8EAED;--mu:#A8ACB1;--fa:#8A8F94;--rule:#4A4D51;--grid:#26282B;--ar:#8A8F94;--hl:#C8CBCF;--ink-f:#E8EAED;--ink-s:#E8EAED;--ink-t:#17181A;--ink-u:#3A3D41;--mid-f:#4A4D51;--mid-s:#C8CBCF;--mid-t:#F0F1F3;--mid-u:#C3C7CB;--pale-f:#2A2C2F;--pale-s:#C8CBCF;--pale-t:#F0F1F3;--pale-u:#B0B4B8;--open-f:#17181A;--open-s:#C8CBCF;--open-t:#F0F1F3;--open-u:#A8ACB1;--hatch-f:#17181A;--hatch-s:#C8CBCF;--hatch-t:#F0F1F3;--hatch-u:#A8ACB1}}.bg{fill:var(--bg)}.tx{fill:var(--tx)}.mu{fill:var(--mu)}.fa{fill:var(--fa)}</style><defs><marker id='ah' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='var(--ar)'/></marker><pattern id='hx' patternUnits='userSpaceOnUse' width='7' height='7' patternTransform='rotate(45)'><rect width='7' height='7' fill='var(--bg)'/><line x1='0' y1='0' x2='0' y2='7' stroke='var(--hl)' stroke-width='1.5'/></pattern></defs><rect x='0' y='0' width='980' height='705' class='bg'/><text x='490' y='38' text-anchor='middle' font-size='18' font-weight='700' class='tx'>Engine đưa gì, mod giữ gì, bạn thấy gì</text><rect x='30' y='62' width='920' height='164' rx='12' fill='var(--mid-f)' stroke='var(--mid-s)' stroke-width='1.6'/><text x='52' y='102' text-anchor='start' font-size='19' font-weight='700' fill='var(--mid-t)'>ENGINE ĐƯA GÌ</text><text x='52' y='124' text-anchor='start' font-size='13' font-weight='400' fill='var(--mid-u)'>mod nghe các sự kiện này, cộng hai bộ hẹn giờ riêng</text><rect x='48' y='130' width='209' height='72' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='152.5' y='155.3' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>turn.step</text><text x='152.5' y='173.8' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>mỗi yêu cầu, kèm số tin nhắn và</text><text x='152.5' y='188.8' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>mức dùng</text><rect x='273' y='130' width='209' height='72' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='377.5' y='153.5' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>session.measure,</text><text x='377.5' y='172' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>session.compact</text><text x='377.5' y='190.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>hook classic đứng đỡ phía sau</text><rect x='498' y='130' width='209' height='72' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='602.5' y='162.8' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>agent.spawn, turn.complete</text><text x='602.5' y='181.3' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>tác tử con bắt đầu và kết thúc</text><rect x='723' y='130' width='209' height='72' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='827.5' y='155.3' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>Hai nhịp</text><text x='827.5' y='173.8' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>mười giây cho đồng hồ; mỗi phút</text><text x='827.5' y='188.8' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>cho theme và đếm ngược reset</text><line x1='0' y1='257' x2='980' y2='257' stroke='var(--tx)' stroke-width='1.6' stroke-dasharray='9 7'/><rect x='290' y='240' width='400' height='34' rx='17' fill='var(--tx)'/><text x='490' y='263' text-anchor='middle' font-size='14' font-weight='700' fill='var(--bg)'>MỘT MODULE CÀI SẴN CÓ THỂ CHẮN Ở ĐÂY</text><line x1='200' y1='230' x2='200' y2='284' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><text x='208' y='282' text-anchor='start' font-size='12' font-weight='400' class='mu'>máy có quản trị: session.compact không tới mod</text><rect x='30' y='288' width='920' height='179' rx='12' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.6'/><text x='52' y='328' text-anchor='start' font-size='19' font-weight='700' fill='var(--open-t)'>MOD GIỮ GÌ</text><text x='52' y='350' text-anchor='start' font-size='13' font-weight='400' fill='var(--open-u)'>trong bộ nhớ; riêng bố cục để ở $.store nên qua phiên vẫn còn</text><rect x='48' y='356' width='209' height='87' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='152.5' y='396.3' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>Đồng hồ ngữ cảnh</text><text x='152.5' y='414.8' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>và hook nào ghi lần cuối</text><rect x='273' y='356' width='209' height='87' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='377.5' y='379.5' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>Một lần đọc hạn mức cho cả</text><text x='377.5' y='398' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>máy</text><text x='377.5' y='416.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>để ở $.store, ba phút gọi một</text><text x='377.5' y='431.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>lần</text><rect x='498' y='356' width='209' height='87' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='602.5' y='388.8' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>Giờ cache</text><text x='602.5' y='407.3' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>đếm từ yêu cầu gần nhất của vòng</text><text x='602.5' y='422.3' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>chính</text><rect x='723' y='356' width='209' height='87' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='827.5' y='388.8' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>Sổ tác tử con</text><text x='827.5' y='407.3' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>ba mươi hàng, mỗi hàng một tác</text><text x='827.5' y='422.3' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>tử con</text><line x1='490' y1='473' x2='490' y2='505' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><rect x='30' y='511' width='920' height='150' rx='12' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.6'/><text x='52' y='551' text-anchor='start' font-size='19' font-weight='700' fill='var(--pale-t)'>BẠN THẤY GÌ</text><text x='52' y='573' text-anchor='start' font-size='13' font-weight='400' fill='var(--pale-u)'>vẽ từ bộ nhớ, lúc vẽ không đọc gì thêm</text><rect x='48' y='579' width='284' height='58' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='190' y='604.8' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>Dải</text><text x='190' y='623.3' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>tối đa bốn dòng, trên ô gõ</text><rect x='348' y='579' width='284' height='58' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='490' y='604.8' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>Ba tab</text><text x='490' y='623.3' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>/sl help, /sl settings, /sl agents</text><rect x='648' y='579' width='284' height='58' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='790' y='604.8' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>/sl debug</text><text x='790' y='623.3' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>chữ thuần, kèm lý do mỗi ô trống</text><text x='490' y='691' text-anchor='middle' font-size='12.5' font-weight='400' class='mu' font-style='italic'>Hook ghi số khi sự kiện tới, lúc vẽ chỉ đọc. Hai nhịp và turn.step vẫn qua được chỗ chắn.</text></svg>