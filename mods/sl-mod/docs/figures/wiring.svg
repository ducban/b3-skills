<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 712' width='980' height='712' font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif"><style>svg{--bg:#FFFFFF;--tx:#1A1A1A;--mu:#555555;--fa:#777777;--rule:#CCCCCC;--grid:#EEEEEE;--ar:#666666;--hl:#1A1A1A;--ink-f:#1A1A1A;--ink-s:#1A1A1A;--ink-t:#FFFFFF;--ink-u:#D0D0D0;--mid-f:#D9D9D9;--mid-s:#1A1A1A;--mid-t:#1A1A1A;--mid-u:#555555;--pale-f:#F2F2F2;--pale-s:#1A1A1A;--pale-t:#1A1A1A;--pale-u:#555555;--open-f:#FFFFFF;--open-s:#1A1A1A;--open-t:#1A1A1A;--open-u:#555555;--hatch-f:#FFFFFF;--hatch-s:#1A1A1A;--hatch-t:#1A1A1A;--hatch-u:#555555}@media (prefers-color-scheme:dark){svg{--bg:#17181A;--tx:#E8EAED;--mu:#A8ACB1;--fa:#8A8F94;--rule:#4A4D51;--grid:#26282B;--ar:#8A8F94;--hl:#C8CBCF;--ink-f:#E8EAED;--ink-s:#E8EAED;--ink-t:#17181A;--ink-u:#3A3D41;--mid-f:#4A4D51;--mid-s:#C8CBCF;--mid-t:#F0F1F3;--mid-u:#C3C7CB;--pale-f:#2A2C2F;--pale-s:#C8CBCF;--pale-t:#F0F1F3;--pale-u:#B0B4B8;--open-f:#17181A;--open-s:#C8CBCF;--open-t:#F0F1F3;--open-u:#A8ACB1;--hatch-f:#17181A;--hatch-s:#C8CBCF;--hatch-t:#F0F1F3;--hatch-u:#A8ACB1}}.bg{fill:var(--bg)}.tx{fill:var(--tx)}.mu{fill:var(--mu)}.fa{fill:var(--fa)}</style><defs><marker id='ah' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='var(--ar)'/></marker><pattern id='hx' patternUnits='userSpaceOnUse' width='7' height='7' patternTransform='rotate(45)'><rect width='7' height='7' fill='var(--bg)'/><line x1='0' y1='0' x2='0' y2='7' stroke='var(--hl)' stroke-width='1.5'/></pattern></defs><rect x='0' y='0' width='980' height='712' class='bg'/><text x='490' y='38' text-anchor='middle' font-size='18' font-weight='700' class='tx'>What the engine hands the mod, what it keeps, what it draws</text><rect x='30' y='62' width='920' height='179' rx='12' fill='var(--mid-f)' stroke='var(--mid-s)' stroke-width='1.6'/><text x='52' y='102' text-anchor='start' font-size='19' font-weight='700' fill='var(--mid-t)'>WHAT THE ENGINE HANDS IT</text><text x='52' y='124' text-anchor='start' font-size='13' font-weight='400' fill='var(--mid-u)'>events the mod listens to, and two timers of its own</text><rect x='48' y='130' width='209' height='87' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='152.5' y='162.8' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>turn.step</text><text x='152.5' y='181.3' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>every request, with its message</text><text x='152.5' y='196.3' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>count and usage</text><rect x='273' y='130' width='209' height='87' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='377.5' y='153.5' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>session.measure,</text><text x='377.5' y='172' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>session.compact</text><text x='377.5' y='190.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>and the classic hooks as</text><text x='377.5' y='205.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>backstop</text><rect x='498' y='130' width='209' height='87' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='602.5' y='170.3' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>agent.spawn, turn.complete</text><text x='602.5' y='188.8' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>a subagent starting and ending</text><rect x='723' y='130' width='209' height='87' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='827.5' y='155.3' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>Two ticks</text><text x='827.5' y='173.8' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>ten seconds for the gauge; a</text><text x='827.5' y='188.8' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>minute for the theme and the</text><text x='827.5' y='203.8' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>reset countdown</text><line x1='0' y1='272' x2='980' y2='272' stroke='var(--tx)' stroke-width='1.6' stroke-dasharray='9 7'/><rect x='305.8' y='255' width='368.5' height='34' rx='17' fill='var(--tx)'/><text x='490' y='278' text-anchor='middle' font-size='14' font-weight='700' fill='var(--bg)'>A BUNDLED MODULE MAY SIT IN FRONT</text><line x1='215.8' y1='245' x2='215.8' y2='299' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><text x='223.8' y='297' text-anchor='start' font-size='12' font-weight='400' class='mu'>on a managed machine session.compact never arrives</text><rect x='30' y='303' width='920' height='160.5' rx='12' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.6'/><text x='52' y='343' text-anchor='start' font-size='19' font-weight='700' fill='var(--open-t)'>WHAT THE MOD KEEPS</text><text x='52' y='365' text-anchor='start' font-size='13' font-weight='400' fill='var(--open-u)'>in memory, and the layout in $.store so it outlives the session</text><rect x='48' y='371' width='209' height='68.5' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='152.5' y='402' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>The context gauge</text><text x='152.5' y='420.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>and which hook last wrote it</text><rect x='273' y='371' width='209' height='68.5' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='377.5' y='394.5' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>One quota reading a machine</text><text x='377.5' y='413' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>shared through $.store, fetched</text><text x='377.5' y='428' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>every three minutes</text><rect x='498' y='371' width='209' height='68.5' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='602.5' y='394.5' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>The cache hour</text><text x='602.5' y='413' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>counted from the last main-loop</text><text x='602.5' y='428' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>request</text><rect x='723' y='371' width='209' height='68.5' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='827.5' y='402' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>The agents ledger</text><text x='827.5' y='420.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>thirty rows, one a subagent</text><line x1='490' y1='469.5' x2='490' y2='501.5' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><rect x='30' y='507.5' width='920' height='160.5' rx='12' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.6'/><text x='52' y='547.5' text-anchor='start' font-size='19' font-weight='700' fill='var(--pale-t)'>WHAT YOU SEE</text><text x='52' y='569.5' text-anchor='start' font-size='13' font-weight='400' fill='var(--pale-u)'>drawn from memory, nothing read on the draw path</text><rect x='48' y='575.5' width='284' height='68.5' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='190' y='606.5' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>The band</text><text x='190' y='625' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>up to four lines above the prompt</text><rect x='348' y='575.5' width='284' height='68.5' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='490' y='606.5' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>Three tabs</text><text x='490' y='625' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>/sl help, /sl settings, /sl agents</text><rect x='648' y='575.5' width='284' height='68.5' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='790' y='599' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--open-t)'>/sl debug</text><text x='790' y='617.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>plain text, with the note behind every empty</text><text x='790' y='632.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>cell</text><text x='490' y='698' text-anchor='middle' font-size='12.5' font-weight='400' class='mu' font-style='italic'>The hooks write state as events land; a redraw only reads it. The ticks and turn.step pass the boundary.</text></svg>