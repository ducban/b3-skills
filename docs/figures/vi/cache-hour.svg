<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 832 540' width='832' height='540' font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif"><style>svg{--bg:#FFFFFF;--tx:#1A1A1A;--mu:#555555;--fa:#777777;--rule:#CCCCCC;--grid:#EEEEEE;--ar:#666666;--hl:#1A1A1A;--ink-f:#1A1A1A;--ink-s:#1A1A1A;--ink-t:#FFFFFF;--ink-u:#D0D0D0;--mid-f:#D9D9D9;--mid-s:#1A1A1A;--mid-t:#1A1A1A;--mid-u:#555555;--pale-f:#F2F2F2;--pale-s:#1A1A1A;--pale-t:#1A1A1A;--pale-u:#555555;--open-f:#FFFFFF;--open-s:#1A1A1A;--open-t:#1A1A1A;--open-u:#555555;--hatch-f:#FFFFFF;--hatch-s:#1A1A1A;--hatch-t:#1A1A1A;--hatch-u:#555555}@media (prefers-color-scheme:dark){svg{--bg:#17181A;--tx:#E8EAED;--mu:#A8ACB1;--fa:#8A8F94;--rule:#4A4D51;--grid:#26282B;--ar:#8A8F94;--hl:#C8CBCF;--ink-f:#E8EAED;--ink-s:#E8EAED;--ink-t:#17181A;--ink-u:#3A3D41;--mid-f:#4A4D51;--mid-s:#C8CBCF;--mid-t:#F0F1F3;--mid-u:#C3C7CB;--pale-f:#2A2C2F;--pale-s:#C8CBCF;--pale-t:#F0F1F3;--pale-u:#B0B4B8;--open-f:#17181A;--open-s:#C8CBCF;--open-t:#F0F1F3;--open-u:#A8ACB1;--hatch-f:#17181A;--hatch-s:#C8CBCF;--hatch-t:#F0F1F3;--hatch-u:#A8ACB1}}.bg{fill:var(--bg)}.tx{fill:var(--tx)}.mu{fill:var(--mu)}.fa{fill:var(--fa)}</style><defs><marker id='ah' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='var(--ar)'/></marker><pattern id='hx' patternUnits='userSpaceOnUse' width='7' height='7' patternTransform='rotate(45)'><rect width='7' height='7' fill='var(--bg)'/><line x1='0' y1='0' x2='0' y2='7' stroke='var(--hl)' stroke-width='1.5'/></pattern></defs><rect x='0' y='0' width='832' height='540' class='bg'/><text x='416' y='38' text-anchor='middle' font-size='18' font-weight='700' class='tx'>Một giờ cache sống, và cái cổng ở cuối giờ</text><line x1='531' y1='160.5' x2='538' y2='162.8' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><line x1='655' y1='257' x2='655' y2='299' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><line x1='540' y1='394.5' x2='533' y2='396.8' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><line x1='301' y1='397.5' x2='294' y2='395.2' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><line x1='177' y1='301' x2='177' y2='259' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><line x1='292' y1='163.5' x2='299' y2='161.2' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><rect x='306' y='72' width='220' height='102' rx='8' fill='var(--mid-f)' stroke='var(--mid-s)' stroke-width='1.4'/><text x='416' y='119.8' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--mid-t)'>Vòng chính gửi một yêu cầu</text><text x='416' y='138.3' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--mid-u)'>turn.step thấy nó đi và về</text><rect x='545' y='150' width='220' height='102' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='655' y='190.3' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--pale-t)'>cache ▰▰▰▰▰ 1h00m</text><text x='655' y='208.8' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>thanh vơi dần, tính từ yêu cầu gần</text><text x='655' y='223.8' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>nhất</text><rect x='545' y='306' width='220' height='102' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='655' y='337' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--pale-t)'>Vàng khi còn dưới hai mươi</text><text x='655' y='355.5' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--pale-t)'>phút, đỏ khi còn dưới mười</text><text x='655' y='374' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>hết giờ là rắc rối thật, nên màu ở</text><text x='655' y='389' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>đây là màu của đồng hồ</text><rect x='306' y='384' width='220' height='102' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='416' y='424.3' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--pale-t)'>cache cold</text><text x='416' y='442.8' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>giờ đã hết; yêu cầu kế tiếp đọc</text><text x='416' y='457.8' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>lại cả bản ghi hội thoại</text><rect x='67' y='306' width='220' height='102' rx='8' fill='var(--ink-f)' stroke='var(--ink-s)' stroke-width='1.4'/><text x='177' y='329.5' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--ink-t)'>Cổng chặn prompt đầu tiên bạn</text><text x='177' y='348' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--ink-t)'>gõ</text><text x='177' y='366.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--ink-u)'>đúng một lần, báo số token phải</text><text x='177' y='381.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--ink-u)'>đọc lại; bản nháp còn nguyên trong</text><text x='177' y='396.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--ink-u)'>ô</text><rect x='67' y='150' width='220' height='102' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='177' y='190.3' text-anchor='middle' font-size='13.5' font-weight='700' fill='var(--pale-t)'>Nhấn Enter lần nữa là gửi</text><text x='177' y='208.8' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>yêu cầu đó làm ấm cache, và giờ</text><text x='177' y='223.8' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>đếm lại từ đầu</text><text x='416' y='526' text-anchor='middle' font-size='12.5' font-weight='400' class='mu' font-style='italic'>Lệnh gạch chéo, prompt gõ giữa lượt, prompt không người gõ, hay cửa sổ dưới 50k token thì không bao giờ bị hỏi.</text></svg>