<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 631' width='500' height='631' font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif"><style>svg{--bg:#FFFFFF;--tx:#1A1A1A;--mu:#555555;--fa:#777777;--rule:#CCCCCC;--grid:#EEEEEE;--ar:#666666;--hl:#1A1A1A;--ink-f:#1A1A1A;--ink-s:#1A1A1A;--ink-t:#FFFFFF;--ink-u:#D0D0D0;--mid-f:#D9D9D9;--mid-s:#1A1A1A;--mid-t:#1A1A1A;--mid-u:#555555;--pale-f:#F2F2F2;--pale-s:#1A1A1A;--pale-t:#1A1A1A;--pale-u:#555555;--open-f:#FFFFFF;--open-s:#1A1A1A;--open-t:#1A1A1A;--open-u:#555555;--hatch-f:#FFFFFF;--hatch-s:#1A1A1A;--hatch-t:#1A1A1A;--hatch-u:#555555}@media (prefers-color-scheme:dark){svg{--bg:#17181A;--tx:#E8EAED;--mu:#A8ACB1;--fa:#8A8F94;--rule:#4A4D51;--grid:#26282B;--ar:#8A8F94;--hl:#C8CBCF;--ink-f:#E8EAED;--ink-s:#E8EAED;--ink-t:#17181A;--ink-u:#3A3D41;--mid-f:#4A4D51;--mid-s:#C8CBCF;--mid-t:#F0F1F3;--mid-u:#C3C7CB;--pale-f:#2A2C2F;--pale-s:#C8CBCF;--pale-t:#F0F1F3;--pale-u:#B0B4B8;--open-f:#17181A;--open-s:#C8CBCF;--open-t:#F0F1F3;--open-u:#A8ACB1;--hatch-f:#17181A;--hatch-s:#C8CBCF;--hatch-t:#F0F1F3;--hatch-u:#A8ACB1}}.bg{fill:var(--bg)}.tx{fill:var(--tx)}.mu{fill:var(--mu)}.fa{fill:var(--fa)}</style><defs><marker id='ah' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='var(--ar)'/></marker><pattern id='hx' patternUnits='userSpaceOnUse' width='7' height='7' patternTransform='rotate(45)'><rect width='7' height='7' fill='var(--bg)'/><line x1='0' y1='0' x2='0' y2='7' stroke='var(--hl)' stroke-width='1.5'/></pattern></defs><rect x='0' y='0' width='500' height='631' class='bg'/><text x='250' y='38' text-anchor='middle' font-size='18' font-weight='700' class='tx'>A risky Bash call, held until you answer</text><rect x='40' y='62' width='420' height='73' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='250' y='86' text-anchor='middle' font-size='14' font-weight='700' fill='var(--pale-t)'>Claude calls Bash with rm -rf, git reset --hard, git</text><text x='250' y='105' text-anchor='middle' font-size='14' font-weight='700' fill='var(--pale-t)'>clean or a force push</text><text x='250' y='124' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>the guard reads the command text; it does not parse shell</text><rect x='40' y='175' width='420' height='73' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='250' y='201' text-anchor='middle' font-size='14' font-weight='700' fill='var(--pale-t)'>The call is held before it runs</text><text x='250' y='220' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>a loop of quarter-second sleeps, up to ten minutes, inside a $ call</text><text x='250' y='235' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>so the hook keeps its time</text><line x1='250' y1='139' x2='250' y2='171' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><rect x='40' y='288' width='420' height='73' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='250' y='314' text-anchor='middle' font-size='14' font-weight='700' fill='var(--pale-t)'>What it would destroy is measured</text><text x='250' y='333' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>files and size for rm, changed files for reset, git clean -n for</text><text x='250' y='348' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>clean, the commits a force push drops</text><line x1='250' y1='252' x2='250' y2='284' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><rect x='40' y='401' width='420' height='73' rx='8' fill='var(--ink-f)' stroke='var(--ink-s)' stroke-width='1.4'/><text x='250' y='434.5' text-anchor='middle' font-size='14' font-weight='700' fill='var(--ink-t)'>The report takes row one of the band</text><text x='250' y='453.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--ink-u)'>1 runs it as written; 2, Esc, silence or an error in the guard refuse</text><line x1='250' y1='365' x2='250' y2='397' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><rect x='40' y='514' width='420' height='73' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='250' y='540' text-anchor='middle' font-size='14' font-weight='700' fill='var(--pale-t)'>Claude reads the answer</text><text x='250' y='559' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>a refusal says what it would have destroyed, so the same line is not</text><text x='250' y='574' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>tried again</text><line x1='250' y1='478' x2='250' y2='510' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><text x='250' y='617' text-anchor='middle' font-size='12.5' font-weight='400' class='mu' font-style='italic'>Off by default; guard (a) in /sl-settings turns it on, and the choice is stored like the layout.</text></svg>