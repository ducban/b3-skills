<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1118 179' width='1118' height='179' font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif"><style>svg{--bg:#FFFFFF;--tx:#1A1A1A;--mu:#555555;--fa:#777777;--rule:#CCCCCC;--grid:#EEEEEE;--ar:#666666;--hl:#1A1A1A;--ink-f:#1A1A1A;--ink-s:#1A1A1A;--ink-t:#FFFFFF;--ink-u:#D0D0D0;--mid-f:#D9D9D9;--mid-s:#1A1A1A;--mid-t:#1A1A1A;--mid-u:#555555;--pale-f:#F2F2F2;--pale-s:#1A1A1A;--pale-t:#1A1A1A;--pale-u:#555555;--open-f:#FFFFFF;--open-s:#1A1A1A;--open-t:#1A1A1A;--open-u:#555555;--hatch-f:#FFFFFF;--hatch-s:#1A1A1A;--hatch-t:#1A1A1A;--hatch-u:#555555}@media (prefers-color-scheme:dark){svg{--bg:#17181A;--tx:#E8EAED;--mu:#A8ACB1;--fa:#8A8F94;--rule:#4A4D51;--grid:#26282B;--ar:#8A8F94;--hl:#C8CBCF;--ink-f:#E8EAED;--ink-s:#E8EAED;--ink-t:#17181A;--ink-u:#3A3D41;--mid-f:#4A4D51;--mid-s:#C8CBCF;--mid-t:#F0F1F3;--mid-u:#C3C7CB;--pale-f:#2A2C2F;--pale-s:#C8CBCF;--pale-t:#F0F1F3;--pale-u:#B0B4B8;--open-f:#17181A;--open-s:#C8CBCF;--open-t:#F0F1F3;--open-u:#A8ACB1;--hatch-f:#17181A;--hatch-s:#C8CBCF;--hatch-t:#F0F1F3;--hatch-u:#A8ACB1}}.bg{fill:var(--bg)}.tx{fill:var(--tx)}.mu{fill:var(--mu)}.fa{fill:var(--fa)}</style><defs><marker id='ah' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='var(--ar)'/></marker><pattern id='hx' patternUnits='userSpaceOnUse' width='7' height='7' patternTransform='rotate(45)'><rect width='7' height='7' fill='var(--bg)'/><line x1='0' y1='0' x2='0' y2='7' stroke='var(--hl)' stroke-width='1.5'/></pattern></defs><rect x='0' y='0' width='1118' height='179' class='bg'/><text x='559' y='38' text-anchor='middle' font-size='18' font-weight='700' class='tx'>Một bài tiếng Việt đi qua bốn chặng</text><rect x='30' y='62' width='230' height='73' rx='8' fill='var(--ink-f)' stroke='var(--ink-s)' stroke-width='1.4'/><text x='145' y='86' text-anchor='middle' font-size='14' font-weight='700' fill='var(--ink-t)'>b3-write-human dẫn tay lúc</text><text x='145' y='105' text-anchor='middle' font-size='14' font-weight='700' fill='var(--ink-t)'>viết nháp</text><text x='145' y='124' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--ink-u)'>cấm từ, nhịp câu, thuật ngữ</text><rect x='306' y='62' width='230' height='73' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='421' y='95.5' text-anchor='middle' font-size='14' font-weight='700' fill='var(--pale-t)'>Cổng tự soi hỏi ba câu</text><text x='421' y='114.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>ngay trước khi giao bài</text><line x1='264' y1='98.5' x2='302' y2='98.5' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><rect x='582' y='62' width='230' height='73' rx='8' fill='var(--pale-f)' stroke='var(--pale-s)' stroke-width='1.4'/><text x='697' y='95.5' text-anchor='middle' font-size='14' font-weight='700' fill='var(--pale-t)'>humanizer soi bản đã xong</text><text x='697' y='114.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--pale-u)'>33 dấu hiệu máy viết</text><line x1='540' y1='98.5' x2='578' y2='98.5' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><rect x='858' y='62' width='230' height='73' rx='8' fill='var(--open-f)' stroke='var(--open-s)' stroke-width='1.4'/><text x='973' y='95.5' text-anchor='middle' font-size='14' font-weight='700' fill='var(--open-t)'>Vale đếm lỗi trên 1.000 chữ</text><text x='973' y='114.5' text-anchor='middle' font-size='11.5' font-weight='400' fill='var(--open-u)'>bề mặt, không đo giọng</text><line x1='816' y1='98.5' x2='854' y2='98.5' stroke='var(--ar)' stroke-width='1.8' marker-end='url(#ah)'/><text x='559' y='165' text-anchor='middle' font-size='12.5' font-weight='400' class='mu' font-style='italic'>Ba chặng đầu không thay nhau: viết đúng, tự soi, rồi mới để bộ soi dọn. Chặng bốn chỉ cho ra một con số để so trước sau.</text></svg>